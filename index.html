<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LendMate VA Training</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light}
body{margin:0;background:#FFFFFF;color:#1F0B45;font-family:'Montserrat',Arial,sans-serif;font-size:16px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding-block:72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eb{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#3D1878;margin:0 0 8px}
h1{font-family:'Bebas Neue',Arial,sans-serif;font-weight:400;font-size:clamp(44px,10vw,72px);line-height:.96;margin:0 0 16px}
p{margin:0 0 16px;color:#4A3A6B}
a.btn{display:inline-block;font-weight:700;text-decoration:none;color:#FFFFFF;background:#3D1878;border-radius:10px;padding:12px 22px}
a.btn:hover{background:#4A1F8E}
</style>
<body>
<main>
  <p class="eb">LendMate VA training</p>
  <h1>Log in to start.</h1>
  <p>The guide, the quizzes and the study materials are on the training site. Log in with your email. The first time, you get a sign-in email and then choose a password.</p>
  <a class="btn" href="https://lendmate-quiz-app.vercel.app">Log in</a>
</main>
</body>
</html>
